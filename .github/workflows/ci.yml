name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure netcat (ledger-stream test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd
      - name: Run shell test suite
        run: |
          fail=0
          for t in tests/*.test.sh; do
            echo "==== $t ===="
            if bash "$t"; then
              echo "  -> PASS: $t"
            else
              echo "  -> FAIL: $t"
              fail=1
            fi
          done
          exit $fail
