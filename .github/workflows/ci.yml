name: CI
run-name: ${{ inputs.otta_sha && format('CI {0}', inputs.otta_sha) || 'CI' }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      otta_sha:
        description: Exact SHA marker for non-mutating Otta controller dogfood
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # info/style findings are surfaced for review but never block. Those are
      # the genuine quoting-cleanup bulk (12 info + 14 style at last count);
      # gating them would be churn, not safety.
      - name: shellcheck report (info/style — non-blocking)
        run: shellcheck --severity=style --format=gcc scripts/*.sh hooks/*.sh || true
      # The blocking gate. Started at error severity in #177 because the
      # warning volume was unknown; measured at only 5, all fixed in #182, so
      # it now gates warnings too. This is the class that actually breaks at
      # runtime — e.g. the shipped otta-worktree.sh --prune defect where a
      # BSD-first `stat -f %m` silently parsed as --file-system on Linux.
      #
      # The *.sh glob is what excludes scripts/otta-learning-policy.py: it is
      # Python, so it is left out by targeting shell files, not by a blanket
      # suppression directive inside the file.
      - name: shellcheck gate (warning severity)
        run: shellcheck --severity=warning --format=gcc scripts/*.sh hooks/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # worktree tests branch off the base ref — need full history
      - name: Ensure netcat (ledger-stream test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd
      - name: Run shell test suite
        run: |
          fail=0
          for t in tests/*.test.sh; do
            echo "==== $t ===="
            if bash "$t"; then
              echo "  -> PASS: $t"
            else
              echo "  -> FAIL: $t"
              fail=1
            fi
          done
          exit $fail
